name: Amrutam Telemedicine Backend CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-tests:
    name: Lint, Test & Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amrutam_admin
          POSTGRES_PASSWORD: amrutam_secure_pass_2026
          POSTGRES_DB: amrutam_telemedicine
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Type Checking
        run: npm run lint

      - name: Security Vulnerability Scan
        run: npm audit --audit-level=high

      - name: Run Automated Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://amrutam_admin:amrutam_secure_pass_2026@localhost:5432/amrutam_telemedicine
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long!
          JWT_REFRESH_SECRET: test_refresh_jwt_secret_must_be_at_least_32_characters_long!
          ENCRYPTION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          ENCRYPTION_KEY_ID: kms-v1

      - name: Build Production Artifact
        run: npm run build

  container-build:
    name: Container Build & Trivy Scan
    needs: code-quality-and-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/Dockerfile
          push: false
          tags: amrutam/telemedicine-backend:${{ github.sha }}
