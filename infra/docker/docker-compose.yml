version: '3.8'

services:
  # PostgreSQL 16 ACID Database
  postgres:
    image: postgres:16-alpine
    container_name: amrutam_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amrutam_admin
      POSTGRES_PASSWORD: amrutam_secure_pass_2026
      POSTGRES_DB: amrutam_telemedicine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amrutam_admin -d amrutam_telemedicine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amrutam_net

  # Redis 7 (Distributed Locking, Caching, BullMQ Queues)
  redis:
    image: redis:7-alpine
    container_name: amrutam_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amrutam_net

  # Amrutam Telemedicine Core API Service
  amrutam-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: amrutam_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: ${PORT:-4000}
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-amrutam_admin}:${DB_PASSWORD:-amrutam_secure_pass_2026}@postgres:5432/${DB_NAME:-amrutam_telemedicine}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-amrutam_admin}
      DB_PASSWORD: ${DB_PASSWORD:-amrutam_secure_pass_2026}
      DB_NAME: ${DB_NAME:-amrutam_telemedicine}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-kms-v1}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - amrutam_net

  # Prometheus (Observability Metrics)
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: amrutam_prometheus
    restart: unless-stopped
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - amrutam_net

  # Grafana (Metrics Dashboard)
  grafana:
    image: grafana/grafana:10.3.3
    container_name: amrutam_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=amrutam_telemetry
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - amrutam_net

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: amrutam_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686" # Web UI
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - amrutam_net

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  amrutam_net:
    driver: bridge
