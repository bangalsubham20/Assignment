# Example Kubernetes Secret Template
# In production, inject secrets via HashiCorp Vault, AWS Secrets Manager, or SealedSecrets
apiVersion: v1
kind: Secret
metadata:
  name: amrutam-secrets
  namespace: amrutam-prod
type: Opaque
stringData:
  DB_USER: "amrutam_admin"
  DB_PASSWORD: "REPLACE_WITH_SECURE_VAULT_PASSWORD"
  JWT_SECRET: "REPLACE_WITH_STRONG_RANDOM_32_CHAR_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_STRONG_RANDOM_32_CHAR_REFRESH_SECRET"
  ENCRYPTION_MASTER_KEY: "REPLACE_WITH_64_CHAR_HEX_KMS_KEY_32_BYTES"
  ENCRYPTION_KEY_ID: "kms-v1"
